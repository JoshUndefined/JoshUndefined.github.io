title: "JoshUndefined"
author: "JoshUndefined"
description: "Random ideas and tutorials as I discover them"
default_og_image: "/assets/posts/2025-07-15-JoshUndefinedYTBanner.png"
permalink: /:title/
lang: "en"
excerpt_separator: "<!-- excerpt -->"
date_format: "%Y %B %d"
url: "https://joshundefined.github.io"

# Layout

show_excerpts: true             # show article excerpts instead of archive list on the home page
show_frame: true                # display a grey frame on large screens
show_sidebar: false             # show a sidebar instead of the usual header
show_minimal: false             # remove all clutter

#show_frame: "/assets/images/background.svg"

# Menu                          # for available icons see https://fontawesome.com/v5/icons/

navigation:                     # accepts {file, title, url, icon, sidebaricon}
  - {file: "index.html", sidebaricon: home}
  - {file: "archive.html"}
  # - {file: "README.md", sidebaricon: address-card}

external:                  # shows a footer with social links - for available icons see fontawesome.com/icons
  - {title: Github, icon: github, url: "https://github.com/joshundefined/"}
  - {title: Twitter-X, icon: twitter, url: "https://x.com/JoshUndefined"}
  - {title: Bluesky, icon: bluesky, url: "https://bsky.app/profile/joshundefined.com"}
  - {title: Twitch, icon: twitch, url: "https://www.twitch.tv/JoshUndefined"}
  - {title: YouTube, icon: youtube, url: "https://www.youtube.com/@joshundefined"}

comments:
